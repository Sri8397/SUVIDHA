version: "1.3"
category: group_membership

# Every group workflow is declared here. Actors and conditions are the only permission
# checks; the actions in PeerSplitService/GroupMembershipService do protocol work only.
#
# Actors:     active_member (active in the group roster), owner_only (active admin), user (any local user)
# Context:    groupId, actorMemberId, targetMemberId, note (free text),
#             attributes[eventId|debtUnitId|splitDraft|amountMinor|currencyCode]

rules:
  create_group:
    actor: user
    conditions:
      - group_name_valid
      - has_nostr_identity
    actions:
      - create_mls_group

  post_message:
    actor: active_member
    conditions:
      - message_text_valid
    actions:
      - publish_chat_message

  add_split:
    actor: active_member
    conditions:
      - split_participants_are_active_members
    actions:
      - publish_split_expense

  record_payment:
    actor: active_member
    conditions:
      - actor_is_outstanding_debt_creditor
      - payment_amount_within_balance
    actions:
      - publish_settlement

  self_exit:
    actor: active_member
    conditions:
      - owner_must_transfer_or_close
      - own_balance_settled
    confirm: "Leave group?"
    actions:
      - request_mls_self_removal
      - sync_causal_ledger_event
      - confirm_self_removal
    message: "{member} left the group"

  admin_removal:
    actor: owner_only
    conditions:
      - target_is_other_active_member
      - no_outstanding_pairwise_debts
    confirm: "Remove member?"
    actions:
      - mls_remove_member
      - sync_causal_ledger_event
    message: "{member} was removed by admin"

  transfer_ownership:
    actor: owner_only
    conditions:
      - target_is_other_active_member
    confirm: "Transfer ownership?"
    actions:
      - mls_set_group_admins
      - sync_causal_ledger_event
    message: "{member} is now the group owner"

  close_group:
    actor: owner_only
    conditions:
      - no_open_transactions
    confirm: "Close group?"
    actions:
      - mls_remove_all_members
      - request_mls_self_removal
      - sync_causal_ledger_event
    message: "Group closed by owner"

  rename_group:
    actor: owner_only
    conditions:
      - group_name_valid
    actions:
      - publish_group_rename
      - sync_causal_ledger_event
    message: "Group renamed"

  invite_member:
    actor: owner_only
    conditions:
      - recipient_is_friend
      - recipient_has_nostr_id
      - recipient_not_member
      - recipient_has_valid_keypackage
    actions:
      - mls_add_member

  cancel_split:
    actor: active_member
    conditions:
      - actor_is_split_author
      - split_has_outstanding_debts
    confirm: "Cancel split?"
    actions:
      - publish_split_debt_removals
      - sync_causal_ledger_event
    message: "Split cancelled"

  delete_debt:
    actor: active_member
    conditions:
      - actor_is_outstanding_debt_creditor
    confirm: "Delete outstanding debt?"
    actions:
      - publish_debt_removal
      - sync_causal_ledger_event
    message: "Debt removed"

  invitation_enabled:
    actor: user
    conditions:
      - has_nostr_identity
    actions:
      - generate_fresh_mls_keypackage
      - sync_pending_welcomes

  invitation_disabled:
    actor: user
    conditions: []
    actions: []
