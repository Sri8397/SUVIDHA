name: Deploy to Play Store (Internal Testing)

on:
  push:
    branches: [develop]
  workflow_dispatch: # Also allow manual trigger from GitHub UI or `gh workflow run`

# Cancel any in-progress runs on the same branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release Bundle
    # Skips the build and deploy when the head commit contains [skip deploy]
    if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Java / Gradle setup ───────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── Decode signing keystore ───────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      # ── Build signed AAB ──────────────────────────────────────
      - name: Build release AAB
        run: ./gradlew :app:bundleRelease --no-daemon
        env:
          SUVIDHA_KEYSTORE_PATH: ${{ github.workspace }}/app/release.keystore
          SUVIDHA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SUVIDHA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SUVIDHA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ── Upload build artifact ─────────────────────────────────
      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to Google Play
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout (for whatsnew release notes) ─────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Download build artifact ───────────────────────────────
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release

      # ── Upload to Play Store (Internal Testing) ───────────────
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.just_sri.suvidhaapp
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          whatsNewDirectory: whatsnew/
