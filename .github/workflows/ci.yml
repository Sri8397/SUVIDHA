name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch: # Allow manual trigger from GitHub UI

# Cancel superseded runs for the same branch or pull request
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Unit Test and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Java / Gradle setup ───────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── Verify (mirrors the README verification command) ──────
      - name: Assemble, unit test and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --no-daemon

      # ── Publish reports on failure ────────────────────────────
      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: ignore
