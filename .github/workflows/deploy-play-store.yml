name: Deploy to Play Store (Closed Testing)

on:
  push:
    branches: [main, develop]
  workflow_dispatch: # Allow manual trigger from GitHub UI

# Cancel any in-progress runs on the same branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Java / Gradle setup ───────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── Decode signing keystore ───────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      # ── Build signed AAB ──────────────────────────────────────
      - name: Build release AAB
        run: ./gradlew :app:bundleStandardRelease --no-daemon
        env:
          SUVIDHA_KEYSTORE_PATH: ${{ github.workspace }}/app/release.keystore
          SUVIDHA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SUVIDHA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SUVIDHA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ── Upload to Play Store (Closed Testing) ─────────────────
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.just_sri.suvidhaapp
          releaseFiles: app/build/outputs/bundle/standardRelease/app-standard-release.aab
          track: alpha
          status: completed
          whatsNewDirectory: whatsnew/
